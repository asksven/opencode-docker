name: Test Docker Image

on:
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - tests/**
      - .github/workflows/test-image.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - entrypoint.sh
      - tests/**
      - .github/workflows/test-image.yml

permissions:
  contents: read

jobs:
  entrypoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all target platforms
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            OPENCODE_VERSION=latest

      - name: Build runtime test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: opencode-docker:entrypoint-test
          build-args: |
            OPENCODE_VERSION=latest

      - name: Test entrypoint
        env:
          REQUIRE_DOCKER_SOCKET: '1'
        run: bash tests/test-entrypoint.sh opencode-docker:entrypoint-test
