name: Update Docker Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/update-image.yml
  schedule:
    - cron: '0 0 * * *'  # Every day at 00:00 UTC
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild and publish even when the OpenCode version is unchanged
        required: false
        default: false
        type: boolean

concurrency:
  group: update-docker-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/asksven/opencode-docker

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      needs_update: ${{ steps.force.outputs.needs_update || steps.compare.outputs.needs_update }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Get latest stable release from feed
        id: release
        run: |
          set -euo pipefail
          tag="$(
            curl -fsSL "https://github.com/anomalyco/opencode/releases.atom" \
              | grep -o 'releases/tag/[^"]*' \
              | sed 's#releases/tag/##' \
              | grep -m1 -E '^v?[0-9]+\.[0-9]+\.[0-9]+$'
          )"
          if [ -z "$tag" ]; then
            echo "Could not find a stable release tag in the releases feed" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Force update for source changes
        id: force
        if: ${{ github.event_name == 'push' || inputs.force_rebuild }}
        run: echo "needs_update=true" >> "$GITHUB_OUTPUT"

      - name: Compare against published manifests
        id: compare
        if: ${{ github.event_name != 'push' && !inputs.force_rebuild }}
        run: |
          set -euo pipefail
          TARGET_VERSION="${{ steps.release.outputs.version }}"

          if ! docker manifest inspect "${IMAGE}:${TARGET_VERSION}" > /tmp/target.json 2>/dev/null; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! docker manifest inspect "${IMAGE}:latest" > /tmp/latest.json 2>/dev/null; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if diff -q /tmp/target.json /tmp/latest.json > /dev/null; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: ${{ needs.check.outputs.needs_update == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/test-image.yml
    with:
      opencode_version: ${{ needs.check.outputs.version }}

  publish:
    needs: [check, test]
    if: >-
      ${{
        !cancelled() &&
        needs.check.result == 'success' &&
        needs.check.outputs.needs_update == 'true' &&
        needs.test.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OPENCODE_VERSION=${{ needs.check.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.check.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ needs.check.outputs.version }}"
